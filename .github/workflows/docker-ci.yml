# ============================================================
# GitHub Actions: Auto-build & Push to ghcr.io (GitHub Container Registry)
# Chỉ push lên GHCR - không cần Docker Hub!
# ============================================================

name: Deploy Docker Image

on:
  push:
    branches:
      - main
  
jobs:
  build-and-push:
    name: Build & Push to GitHub Container Registry
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image to ghcr.io
        uses: docker/build-push-action@v5
        with:
          push: true
          context: .
          tags: |
            ghcr.io/${{ github.repository_owner }}/ddns-cloudflare:latest
            ghcr.io/${{ github.repository_owner }}/ddns-cloudflare:${{ github.sha }}

