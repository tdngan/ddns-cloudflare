# ============================================================
# GitHub Actions: Auto-build & Push to ghcr.io (GitHub Container Registry)
# Yêu cầu PAT với scope 'write:packages' trong secret GITHUB_TOKEN
# ============================================================

name: Deploy Docker Image

on:
  push:
    branches:
      - main
  
permissions:
  contents: read
  packages: write  # ✅ Cần quyền này để push vào ghcr.io

jobs:
  build-and-push:
    name: Build & Push to GitHub Container Registry
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        # Uses PAT from GITHUB_TOKEN secret (with write:packages scope)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image to ghcr.io
        # Image tags: latest + commit SHA for rollback capability
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/ddns-cloudflare:latest
            ghcr.io/${{ github.repository_owner }}/ddns-cloudflare:${{ github.sha }}
