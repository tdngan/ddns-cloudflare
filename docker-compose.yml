# ============================================================
# Docker Compose: Cloudflare DDNS Auto Update (CRON LINH HOẠT!)
# Sử dụng GHCR.io image - không cần Docker Hub!
# ============================================================
version: '3.8'

services:
  ddns-cloudflare:
    # Container name cho dễ quản lý (KHÔNG phải là image path)
    container_name: cloudflare-ddns
    
    # Pull image từ GitHub Container Registry
    # Thay vì build, dùng pre-built image từ ghcr.io
    image: ghcr.io/tdngan/ddns-cloudflare:latest
    
    # Nếu muốn build local thay vì pull từ registry:
    # build: .
    
    # Restart policy - auto-restart nếu cron daemon crash hoặc container crash
    restart: unless-stopped
    
    # ============================================================
    # ENVIRONMENT VARIABLES
    # ============================================================
    environment:
      # Timezone (Asia/Ho_Chi_Minh)
      - TZ=Asia/Ho_Chi_Minh
      
      # CRON Expression - Mặc định mỗi 5 phút, có thể override
      # Ví dụ: */10 * * * *, 0 * * * *, 0 */2 * * *...
      - CRON_EXPR=*/5 * * * *

    # ============================================================
    # VOLUME MOUNTS (Persistent data)
    # ============================================================
    volumes:
      # Mount .env vào container (Read-only cho an toàn)
      - ./data/.env:/app/.env:ro
      
      # Mount thư mục logs (ghi log cron job vào đây)
      - ./data/logs:/app/logs
      
      # Mount thư mục cache IP (không mất khi restart container)
      - ./data/cache:/app/data
    
    # ============================================================
    # HEALTH CHECK
    # ============================================================
    healthcheck:
      test: ["CMD", "curl", "-f", "https://api.ipify.org"]
      interval: 1m30s   # Kiểm tra mỗi 90 giây
      timeout: 10s       # Timeout sau 10 giây
      retries: 3         # Retry 3 lần nếu fail
      start_period: 60s  # Chờ 60 giây trước khi check (container khởi động + cron daemon)

    # ============================================================
    # LOGGING CONFIGURATION
    # ============================================================
    logging:
      driver: "json-file"
      options:
        max-size: "5m"   # Giới hạn mỗi log file tối đa 5MB
        max-file: "3"    # Tối đa giữ 3 log files (15MB total)

# Networks cho container kết nối với internet (pull/push API, Discord/Telegram notifications)
networks:
  ddns-network:
    name: cloudflare-ddns-net
    driver: bridge